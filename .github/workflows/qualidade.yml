name: Qualidade do Entre Elas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aplicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PITCH_AI_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-navegador
          path: test-results/
          retention-days: 7
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:piloto
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-piloto
          path: test-results/
          retention-days: 7
